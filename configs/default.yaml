# Default hyperparameters. Experiment configs (e.g. p1_kvasir_pilot.yaml) override these.
# Nothing in src/ hard-codes these values (spec 2.6).

global_seed: 42

data:
  mask_threshold: 127        # Kvasir JPEG masks: mask = gray > 127
  min_object_frac: 0.001     # connected components smaller than this fraction of H*W are specks
  connectivity: 8
  split:
    seed: 42
    fractions: {train: 0.7, val: 0.1, test: 0.2}
  coco:                      # COCO val2017 (spec 6.1)
    min_area_frac: 0.01        # keep iscrowd=0 instances with area >= 1% of the image
    n_instances: 1000
    sample_seed: 42
  busi:
    drop_normal: true          # normal images have no lesion (spec 6.1)

metrics:
  nsd_tolerance_px: 2

prompts:
  box_jitter:
    levels: [0.0, 0.05, 0.10, 0.20, 0.30, 0.50]
    seeds: [0, 1, 2]
    max_resample: 10
    min_box_side: 2
  box_scale:
    levels: [0.8, 0.9, 1.0, 1.1, 1.25, 1.5]
    seeds: [0]
    min_box_side: 2
  point_offset:
    levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    seeds: [0, 1, 2]
    band: 0.05

models:
  device: auto               # cuda > mps > cpu
  dtype: float32             # no AMP (needed for MedSAM parity)

runner:
  flush_every: 10

analysis:
  bootstrap_n: 2000
  bootstrap_seed: 42
  ci: 0.95

baselines:
  classical:                 # spec 6.7; grid searched on train only
    channel: [lab_L, lab_a, lab_b, hsv_s, hsv_v]
    polarity: [high, low]
    sigma: [1, 2, 4]
    radius: [2, 5, 10]
    select_on: train
  unet:                      # spec 6.6 default (no course_ref/)
    encoder: resnet34
    encoder_weights: imagenet
    input_size: 352
    epochs: 60
    batch_size: 8
    lr: 1.0e-4
    weight_decay: 1.0e-4
    seed: 0
    num_workers: 2
    color_jitter: 0.1        # light brightness / contrast / saturation jitter
    threshold: 0.5
